# FAR-LIO localization on the HitchOpen "CICV Map Outside" prior map.
# Map: GlobalMap.pcd cropped to the driven area + 0.5 m voxel, shifted/normalised
# by scripts/prepare_prior_map.py (frame "map", origin = map frame).
# Initial pose = first pose of transformations.pcd (the same mapping run).
# =============================================================================
# FAR-LIO (ROS 1 port) - LiDAR odometry node configuration
#
# All keys below except `node.*`, `localization.*` and `output.*` are declared by
# the upstream FAR-LIO pipeline (lib_cpp/odometry_cpp). See
# ../../FAR-LIO/docs/configuration.md for the upstream reference.
# =============================================================================

# --- Node interface -----------------------------------------------------------
node:
  odom_frame: "map"                  # prior map frame
  child_frame: "base_link"           # vehicle frame (static TF base_link -> velodyne in launch)
  cloud_frame: "velodyne"            # frame_id of the incoming PointCloud2
  input_pointcloud: "/velodyne_points"
  output_odom: "/core/state/lidar_odometry"
  input_map: "/home/komasa/lio_ws/data/maps/pix_cicv_local_map.pcd"
  wait_tf: false                     # true = take initial pose from TF odom->child
  max_cloud_range: 0.0               # [m] optional node-side range crop, 0 = off

# --- Localization mode (used when pipeline.update_map: false) -----------------
localization:
  # [x, y, z, roll, pitch, yaw] in odom_frame
  initial_pose: [-274.571, -207.086, 0.724, -0.00852, 0.04002, 2.07583]

# --- Output -------------------------------------------------------------------
output:
  map_path: "/tmp/farlio_map.pcd"    # target of the ~save_map service

# --- Pipeline -----------------------------------------------------------------
pipeline:
  update_map: false                  # localization against the HitchOpen CICV map
  undistort: true
  preprocess: true
  downsample: false
  buffer_z: false
  debug_mode: false
  num_threads: 8

covariance:
  min_cov_translation: [0.01, 0.01, 0.02]
  min_cov_orientation: [0.02, 0.02, 0.0001]
  min_cov_linear_twist: [0.1, 0.1, 0.1]
  min_cov_angular_twist: [0.01, 0.01, 0.01]

diagnostic:
  check_input_status: false
  frame_outdated: 100.0
  check_forward: false
  min_motion_threshold: 0.5
  check_ellipsis: true
  ellipsis_size_s: 5.0
  ellipsis_size_d: 2.5
  check_time_diff: true
  max_time_diff: 50.0
  enable_vel: true
  check_vel: true
  vel_motion_threshold: 0.0

distortion:
  max_time_diff: 30.0
  vel_threshold: 3.0

map:
  frame_map: false
  voxel_size: 1.0                    # [m] prior map is downsampled to 0.5 m
  max_distance: 500.0                # [m]
  cov_regularization: "FROBENIUS"    # SVD | MIN_EIGENVALUE | FROBENIUS

model:
  initial_pos_x: 0.0
  initial_pos_y: 0.0
  initial_pos_z: 0.0
  initial_rot_x: 0.0
  initial_rot_y: 0.0
  initial_rot_z: 0.0
  initial_rot_w: 1.0

preprocessing:
  crop_range: [1.0, 120.0]           # [min, max] m, size==2 enables
  crop_footprint: [3.0, 1.2]         # [longitudinal, lateral] m, size==2 enables

registration:
  solver_type: "GaussNewton"         # GaussNewton | LevenbergMarquardt
  max_iter: 500
  max_inner_iter: 10
  max_time: 200.0                    # [ms]
  convergence_criterion: 5.0e-3
  damping_factor: 1.0e-9
  damping_scale: 2.0

threshold:
  initial_threshold: 1.0
  min_motion_threshold: 0.25
  max_correspondence_range: 100.0
